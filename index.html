<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>OLAHRAGA Escape Room</title>
<style>
:root{--ink:#f8fafc;--navy:#101827;--panel:rgba(13,22,36,.91);--gold:#ffc857;--blue:#39a8e8;--green:#2ecc71;--red:#ff6464;--line:rgba(255,255,255,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0b1220;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#101827}
.scene{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;isolation:isolate;background:linear-gradient(160deg,#17243b,#0d1524 75%)}
.scene::before{content:"";position:absolute;inset:0;z-index:0;background-image:var(--bg);background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.015)}
.scene::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(3,9,19,.45),rgba(3,9,19,.14) 34%,rgba(3,9,19,.72));pointer-events:none}
.topbar{height:clamp(42px,7.5dvh,60px);flex:0 0 auto;padding:env(safe-area-inset-top) 14px 0;position:relative;z-index:2;display:flex;;align-items:center;justify-content:space-between;gap:8px;background:rgba(6,12,23,.56);border-bottom:1px solid var(--line);backdrop-filter:blur(7px);font-size:clamp(10px,3vw,13px);font-weight:900;letter-spacing:.035em}
.topbar .brand{max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progress{color:#ffe3a1;white-space:nowrap}.sound-toggle{flex:0 0 auto;border:1px solid #ffffff40;background:#ffffff12;color:#fff;border-radius:9px;padding:6px 8px;font-size:11px;font-weight:900;min-height:30px}
.screen{position:relative;z-index:2;width:100%;height:calc(100% - clamp(42px,7.5dvh,60px));;min-height:0;display:flex;flex-direction:column;padding:clamp(10px,2.8vw,16px);gap:clamp(7px,1.5dvh,12px);padding-bottom:max(10px,env(safe-area-inset-bottom));}
.heading{flex:0 0 auto;text-align:center;text-shadow:0 2px 8px #000b}.eyebrow{font-size:clamp(10px,2.8vw,12px);font-weight:900;letter-spacing:.14em;color:#ffe2a2;text-transform:uppercase}.heading h1{font-size:clamp(19px,5.3vw,27px);line-height:1.06;margin:4px 0 3px}.heading p{font-size:clamp(11px,3.1vw,14px);margin:0;color:#f1f5f9;line-height:1.25}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(10px,2.8vw,15px);backdrop-filter:blur(8px);box-shadow:0 8px 28px #0003}.panel h2{font-size:clamp(15px,4.2vw,19px);margin:0 0 5px;line-height:1.15}.panel p{font-size:clamp(11px,3.1vw,13px);line-height:1.32;margin:4px 0}.small{font-size:clamp(10px,2.8vw,12px);color:#d5deeb;line-height:1.25}
.btn{min-height:46px;border:0;border-radius:12px;padding:10px 13px;background:linear-gradient(180deg,#38bdf8,#1677bd);font-weight:900;font-size:clamp(12px,3.3vw,15px);box-shadow:0 3px 0 #084b7a;text-align:center}.btn.gold{background:linear-gradient(180deg,#ffe08a,#f3a91b);color:#392400;box-shadow:0 3px 0 #9c6206}.btn.dark{background:rgba(255,255,255,.12);border:1px solid var(--line);box-shadow:none}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.grow{flex:1;min-height:0}.bottom-row{display:flex;gap:8px;flex:0 0 auto}.bottom-row>*{flex:1;min-width:0}
/* Intro */
.intro-screen{justify-content:flex-end;padding-bottom:max(22px,env(safe-area-inset-bottom))}.intro-logo{font-size:clamp(24px,7vw,36px);line-height:1;font-weight:1000;letter-spacing:.02em;text-shadow:0 3px 15px #000}.intro-sub{font-size:13px;color:#e2e8f0;margin-top:8px}.intro-story{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8vw;background:rgba(0,0,0,.64);backdrop-filter:blur(4px);z-index:5;animation:pop .5s cubic-bezier(.2,1.3,.4,1)}.story-card{width:min(100%,430px);max-height:80%;object-fit:contain;filter:drop-shadow(0 14px 28px #000b);animation:pop .55s cubic-bezier(.2,1.3,.4,1);cursor:pointer}.story-fallback{width:100%;max-width:390px;border:2px solid #b88645;background:#e8d2a4;color:#251a11;border-radius:14px;padding:24px 18px;text-align:center;box-shadow:0 12px 36px #0009}.story-fallback h2{margin-top:0;font-size:24px}.story-fallback p{line-height:1.5;font-size:14px}.story-fallback .btn{width:100%;margin-top:10px}
@keyframes pop{from{opacity:0;transform:translateY(35px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}@keyframes shake{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-7px) scale(1.04)}50%{transform:translateX(7px) scale(1.08)}75%{transform:translateX(-4px) scale(1.04)}}
/* Room 1 */
.event-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px}.event-btn{position:relative;min-height:0;border-radius:14px;border:1px solid rgba(255,255,255,.38);background:linear-gradient(145deg,rgba(24,42,62,.96),rgba(8,16,28,.94));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;box-shadow:inset 0 0 0 1px #fff1,0 5px 12px #0004}.event-btn:last-child{grid-column:1 / -1}.event-btn:active{transform:scale(.98)}.event-icon{font-size:clamp(23px,7vw,36px);line-height:1}.event-name{font-size:clamp(11px,3.2vw,14px);font-weight:900;line-height:1.12}.event-status{font-size:10px;color:#d6e2f0}.event-btn.done{border:2px solid #37d879;background:linear-gradient(145deg,#124c3a,#0c2c28)}.event-btn.done .event-status{color:#8df0b1}.mini-progress{height:5px;background:#ffffff2b;border-radius:99px;overflow:hidden;flex:0 0 auto}.mini-progress span{display:block;height:100%;background:var(--green);transition:width .25s}
/* Options modal */
.modal{position:absolute;inset:0;z-index:10;background:rgba(3,8,16,.82);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));animation:pop .25s ease-out}.modal-card{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;gap:8px;background:rgba(14,24,39,.98);border:1px solid #ffffff35;border-radius:18px;padding:clamp(10px,2.8vw,15px);box-shadow:0 20px 60px #0009}.modal-head{flex:0 0 auto}.modal-head h2{font-size:clamp(17px,4.8vw,22px);margin:0 0 4px}.modal-head p{font-size:clamp(11px,3vw,13px);margin:0;color:#dce6f3}.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px;flex:1;min-height:0}.equipment-option{min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px;border:2px solid #ffffff30;border-radius:12px;background:#f8fafc;color:#152238;overflow:hidden}.equipment-option img{display:block;width:100%;height:clamp(62px,14dvh,112px);object-fit:contain;border-radius:7px;background:#fff}.equipment-option .opt-label{font-size:clamp(10px,2.8vw,12px);font-weight:850;line-height:1.12;text-align:center}.equipment-option .letter{position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:7px;background:#172554;color:white;font-size:11px;display:grid;place-items:center;font-weight:900}.equipment-option.selected{border-color:#42b9ff;background:#dff4ff;box-shadow:0 0 0 2px #42b9ff44}.equipment-option.selected::after{content:"✓";position:absolute;right:5px;top:5px;width:23px;height:23px;border-radius:50%;background:#16864a;color:white;font-weight:1000;display:grid;place-items:center}.equipment-option:disabled{opacity:.8}.feedback{display:none;flex:0 0 auto;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:850;line-height:1.2}.feedback.show{display:block}.feedback.good{background:#d9fbe7;color:#075c2e}.feedback.bad{background:#ffe0e0;color:#8b1515}
/* Room 2 */
.order-list{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}.order-item{display:grid;grid-template-columns:28px 58px minmax(0,1fr) 36px 36px;gap:6px;align-items:center;min-height:0;padding:5px 6px;background:rgba(8,16,28,.87);border:1px solid #ffffff35;border-radius:12px;touch-action:pan-y}.order-item.dragging{opacity:.45}.order-item.over{border-color:#38bdf8}.order-num{font-size:13px;font-weight:1000;background:#ffe08a;color:#352200;border-radius:8px;text-align:center;padding:5px 0}.order-item img{width:58px;height:clamp(44px,8.5dvh,64px);object-fit:contain;border-radius:7px;background:#fff}.order-label{font-size:clamp(11px,3vw,13px);font-weight:900;line-height:1.1}.warmup-fallback{font-size:25px;text-align:center}.order-move{min-height:38px;border-radius:9px;border:1px solid #ffffff30;background:#ffffff13;font-weight:1000;font-size:16px}.order-move:disabled{opacity:.2}
/* Room 3 */
.scenario-img{width:100%;height:clamp(120px,25dvh,210px);object-fit:contain;border-radius:13px;background:rgba(255,255,255,.96);flex:0 1 auto;min-height:80px}.scenario-fallback{height:clamp(120px,25dvh,210px);display:flex;align-items:center;justify-content:center;font-size:clamp(50px,15vw,86px);background:rgba(255,255,255,.94);border-radius:13px;flex:0 1 auto}.safety-options{display:grid;grid-template-columns:1fr;gap:7px;flex:0 0 auto}.safety-option{min-height:43px;text-align:left;padding:9px 11px;border:2px solid #ffffff35;border-radius:11px;background:rgba(11,20,34,.94);font-size:clamp(11px,3.1vw,13px);font-weight:800;line-height:1.2}.safety-option .letter{display:inline-grid;place-items:center;width:23px;height:23px;margin-right:7px;border-radius:7px;background:#f4bd45;color:#2c1c00;font-size:11px}.safety-option.correct{background:#0f5132;border-color:#5de69b}.safety-option.wrong{background:#6b2025;border-color:#ff8585}
/* Ending */
.ending-student{width:min(78vw,370px);max-height:48dvh;object-fit:contain;filter:drop-shadow(0 10px 25px #0007);animation:shake .55s ease-in-out}.ending-center{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}.end-title{font-size:clamp(24px,7vw,36px);line-height:1.05;text-align:center;color:#ffe08a;text-shadow:0 3px 12px #000;font-weight:1000}.toast{position:absolute;z-index:20;left:50%;bottom:max(15px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#101827ed;border:1px solid #ffffff35;border-radius:99px;padding:9px 15px;font-size:12px;font-weight:850;white-space:nowrap}
@media (max-height:650px){.screen{gap:6px;padding-top:7px}.heading h1{font-size:19px}.heading p{font-size:11px}.panel{padding:8px}.panel p{font-size:11px}.event-grid{gap:6px}.equipment-option img{height:clamp(48px,12dvh,75px)}.scenario-img,.scenario-fallback{height:20dvh}.order-item img{height:7dvh}}
@media (min-width:600px){.screen{max-width:560px;margin:0 auto}.topbar{padding-left:max(14px,calc((100vw - 560px)/2));padding-right:max(14px,calc((100vw - 560px)/2))}}
</style>
</head>
<body><div id="app" aria-live="polite"></div>
<script>
const AS='assets/';
const $=s=>document.querySelector(s);
const state={scene:'intro',eventsDone:new Set(),activeEvent:0,selected:new Set(),room2Order:[],safetyIndex:0,storyOpen:false,feedback:'',feedbackType:'',room2Unlocked:false};

const sound={ctx:null,master:null,ambience:null,cricketTimer:null,enabled:false,started:false};
function initAudio(){
 if(sound.ctx){if(sound.ctx.state==='suspended')sound.ctx.resume();return true}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
 sound.ctx=new AC();sound.master=sound.ctx.createGain();sound.master.gain.value=.45;sound.master.connect(sound.ctx.destination);sound.enabled=true;sound.started=true;startAmbience();updateSoundButtons();return true;
}
function toggleSound(){
 if(!sound.ctx){if(!initAudio()){showToast('Bunyi tidak disokong oleh pelayar ini.');return}return}
 sound.enabled=!sound.enabled;sound.master.gain.setTargetAtTime(sound.enabled?.45:0,sound.ctx.currentTime,.08);updateSoundButtons();if(sound.enabled)sfx('tap');
}
function updateSoundButtons(){document.querySelectorAll('.sound-toggle').forEach(b=>{b.textContent=sound.enabled?'🔊 Bunyi ON':'🔇 Bunyi OFF';b.setAttribute('aria-pressed',String(sound.enabled))})}
function startAmbience(){
 if(!sound.ctx||sound.ambience)return;const ctx=sound.ctx,bus=ctx.createGain();bus.gain.value=.22;bus.connect(sound.master);
 const low=ctx.createOscillator(),lg=ctx.createGain();low.type='sine';low.frequency.value=54;lg.gain.value=.20;low.connect(lg);lg.connect(bus);low.start();
 const high=ctx.createOscillator(),hg=ctx.createGain();high.type='triangle';high.frequency.value=82;hg.gain.value=.055;high.connect(hg);hg.connect(bus);high.start();
 const lfo=ctx.createOscillator(),lfog=ctx.createGain();lfo.frequency.value=.12;lfog.gain.value=7;lfo.connect(lfog);lfog.connect(high.frequency);lfo.start();sound.ambience={bus,low,lg,high,hg,lfo,lfog};
 sound.cricketTimer=setInterval(()=>{if(!sound.enabled||!sound.ctx)return;const now=ctx.currentTime;for(let k=0;k<2;k++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=3800+Math.random()*500;g.gain.setValueAtTime(.0001,now+k*.13);g.gain.exponentialRampToValueAtTime(.035,now+k*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,now+k*.13+.10);o.connect(g);g.connect(sound.master);o.start(now+k*.13);o.stop(now+k*.13+.12)}},2600);
}
function sfx(kind){if(!sound.ctx||!sound.enabled)return;const ctx=sound.ctx,now=ctx.currentTime;const tone=(freq,dur,type='sine',vol=.12,endFreq=null,delay=0)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now+delay);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),now+delay+dur);g.gain.setValueAtTime(.0001,now+delay);g.gain.exponentialRampToValueAtTime(vol,now+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,now+delay+dur);o.connect(g);g.connect(sound.master);o.start(now+delay);o.stop(now+delay+dur+.02)};
 if(kind==='tap'){tone(620,.07,'sine',.06);return}if(kind==='pop'){tone(240,.18,'triangle',.12,520);tone(520,.12,'sine',.06,null,.08);return}if(kind==='correct'){tone(520,.15,'sine',.12,680);tone(680,.22,'sine',.10,880,.12);return}if(kind==='wrong'){tone(190,.22,'triangle',.09,130);return}if(kind==='door'){tone(110,.38,'sawtooth',.08,65);tone(420,.24,'triangle',.08,620,.28);return}if(kind==='whoosh'){tone(330,.25,'sawtooth',.045,100);return}if(kind==='scare'){tone(180,.45,'sawtooth',.14,70);tone(880,.12,'triangle',.07,260,.04);return}if(kind==='alarm'){tone(880,.20,'square',.045,700);tone(880,.20,'square',.045,700,.28);tone(880,.20,'square',.045,700,.56);return}}
function showToast(msg){const old=document.querySelector('.sound-toast');if(old)old.remove();const el=document.createElement('div');el.className='toast sound-toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function soundSceneCue(scene){if(!sound.enabled)return;if(['room1','room2','room3'].includes(scene))sfx('whoosh');if(scene==='gate')sfx('door');if(scene==='ending'){sfx('alarm');setTimeout(()=>sfx('scare'),850)}}

const events=[
 {name:'Lompat Tinggi',icon:'🏅',correct:['Tiang dan palang lompat tinggi.png','tilam mendarat.png'],options:['Tiang dan palang lompat tinggi.png','tilam mendarat.png','lempar cakera.png','baton.png']},
 {name:'Lompat Jauh',icon:'🦘',correct:['papan lonjak.png','pita pengukur.png'],options:['papan lonjak.png','pita pengukur.png','baton.png','peluru.png']},
 {name:'Larian Berganti-ganti',icon:'🏃',correct:['baton.png','trek larian.png'],options:['baton.png','trek larian.png','lempar cakera.png','tilam mendarat.png']},
 {name:'Lempar Cakera',icon:'🥏',correct:['lempar cakera.png','sangkar lempar cakera.png'],options:['lempar cakera.png','sangkar lempar cakera.png','baton.png','papan lonjak.png']},
 {name:'Lontar Peluru',icon:'⚫',correct:['peluru.png','bulatan lontaran.png'],options:['peluru.png','bulatan lontaran.png','lempar cakera.png','papan lonjak.png']}
];
const warmups=[
 {id:0,name:'Kepala',file:'1-kepala.png',emoji:'🙂'},
 {id:1,name:'Bahu',file:'2-bahu.png',emoji:'🙆'},
 {id:2,name:'Tangan',file:'3-tangan.png',emoji:'🙌'},
 {id:3,name:'Pinggang',file:'4-pinggang.png',emoji:'🧍'},
 {id:4,name:'Kaki',file:'5-kaki.png',emoji:'🦵'}
];
const safety=[
 {title:'Sebelum Bersukan',q:'Apakah yang perlu dilakukan sebelum bersukan?',file:'q1-sebelum-bersukan.png',emoji:'🏃',opts:['Terus berlari dengan laju','Melakukan pemanasan badan','Duduk dan bermain telefon'],correct:1},
 {title:'Pakaian Sukan',q:'Apakah kasut yang sesuai dipakai semasa bersukan?',file:'q2-pakaian-sukan.png',emoji:'👟',opts:['Memakai selipar','Memakai kasut sukan','Berkaki ayam'],correct:1},
 {title:'Selepas Bersukan',q:'Apakah yang patut dilakukan selepas bersukan?',file:'q3-semasa-bersukan.png',emoji:'💧',opts:['Minum air','Terus berlari dengan laju','Duduk dan bermain telefon'],correct:0},
 {title:'Apabila Cedera',q:'Apakah yang perlu dilakukan jika kamu tercedera semasa bersukan?',file:'q4-apabila-cedera.png',emoji:'🩹',opts:['Menyembunyikan kecederaan','Terus bermain','Berhenti dan beritahu guru'],correct:2},
 {title:'Keselamatan Lontar Peluru',q:'Apakah yang perlu dilakukan sebelum acara lontar peluru?',file:'q5-lontar-peluru.png',emoji:'🏟️',opts:['Berdiri di hadapan peserta','Pastikan kawasan lontaran selamat','Berlari melintasi kawasan lontaran'],correct:1}
];
function assetPath(folder,name){return AS+folder+'/'+name}
function bgFor(scene){const map={intro:'backgrounds/intro.png',room1:'backgrounds/stor-sukan.png',event:'backgrounds/stor-sukan.png',room2:'backgrounds/dewan.png',room3:'backgrounds/padang.png',ending:'backgrounds/ending.png',gate:'backgrounds/padang.png'};return map[scene]||map.intro}
function topbar(label,prog){return `<header class="topbar"><div class="brand">🏃 OLAHRAGA ESCAPE ROOM</div><button class="sound-toggle" onclick="toggleSound()" aria-label="Hidupkan atau matikan bunyi" aria-pressed="${sound.enabled}">${sound.enabled?"🔊 Bunyi ON":"🔇 Bunyi OFF"}</button><div class="progress">${prog}</div></header>`}
function shell(scene,content,label,prog){return `<section class="scene" style="--bg:url('${bgFor(scene)}')">${topbar(label,prog)}${content}</section>`}
function heading(kicker,title,sub){return `<div class="heading"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div>`}
function panelTitle(title,text){return `<div class="panel"><h2>${title}</h2><p>${text}</p></div>`}
function button(text,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${text}</button>`}
function render(){const app=$('#app');if(state.scene==='intro')renderIntro(app);else if(state.scene==='room1')renderRoom1(app);else if(state.scene==='event')renderEvent(app);else if(state.scene==='room2')renderRoom2(app);else if(state.scene==='room3')renderRoom3(app);else if(state.scene==='gate')renderGate(app);else renderEnding(app);}
function renderIntro(app){
 const story=state.storyOpen?`<div class="intro-story" onclick="startGame()"><img class="story-card" src="${assetPath('ui','intro-story.png')}" alt="Cerita misi. Ketik untuk mula." onerror="this.style.display='none';document.getElementById('storyFallback').style.display='block'"><div id="storyFallback" class="story-fallback" style="display:none"><h2>MISI MELARIKAN DIRI</h2><p>Kamu tertidur di dalam kelas. Apabila terjaga, hari sudah malam dan semua pintu sekolah telah dikunci.</p><p>Selesaikan tiga misi untuk mencari jalan keluar!</p><button class="btn gold" onclick="event.stopPropagation();startGame()">MULA</button></div><button aria-label="MULA" style="position:absolute;bottom:13%;width:55%;height:11%;border:0;background:transparent" onclick="event.stopPropagation();startGame()"></button></div>`:'';
 app.innerHTML=shell('intro',`<div class="screen intro-screen"><div class="grow"></div><div><div class="intro-logo">OLAHRAGA<br>ESCAPE ROOM</div><div class="intro-sub">Satu sekolah. Tiga misi. Cari jalan keluar.</div></div></div>${story}`,'MISI MALAM','INTRO');
 if(!state.storyOpen){setTimeout(()=>{if(state.scene==='intro'&&!state.storyOpen){state.storyOpen=true;renderIntro($('#app'))}},3000)}
}
function startGame(){initAudio();sfx('pop');state.scene='room1';state.storyOpen=false;render();soundSceneCue('room1')}
function renderRoom1(app){
 const done=state.eventsDone.size;const eventsHtml=events.map((e,i)=>`<button class="event-btn ${state.eventsDone.has(i)?'done':''}" onclick="openEvent(${i})"><span class="event-icon">${state.eventsDone.has(i)?'✅':e.icon}</span><span class="event-name">${e.name}</span><span class="event-status">${state.eventsDone.has(i)?'SELESAI':'KLIK UNTUK BUKA'}</span></button>`).join('');
 const advance=done===5?`<div class="panel"><h2>🔓 Pintu stor terbuka!</h2><p>Semua acara berjaya diselesaikan.</p>${button('MASUK KE DEWAN →','goRoom2()','gold')}</div>`:'';
 app.innerHTML=shell('room1',`<div class="screen">${heading('MISI 1 / 3','STOR SUKAN','Cari peralatan yang betul untuk setiap acara.') }<div class="panel"><h2>ARAHAN</h2><p>Klik kelima-lima acara. Pilih <b>dua gambar peralatan yang betul</b> bagi setiap acara untuk membuka pintu stor.</p><div class="mini-progress"><span style="width:${done/5*100}%"></span></div><p class="small">${done} daripada 5 acara selesai</p></div><div class="event-grid">${eventsHtml}</div>${advance}</div>`,'STOR SUKAN',`${done}/5`);
}
function openEvent(i){sfx('tap');state.activeEvent=i;state.selected=new Set();state.feedback='';state.scene='event';render()}
function renderEvent(app){const e=events[state.activeEvent];const options=e.options.map((name,i)=>{const selected=state.selected.has(name);const label=name.replace('.png','');return `<button class="equipment-option ${selected?'selected':''}" onclick="toggleEquipment(${JSON.stringify(name).replace(/"/g,'&quot;')})" aria-pressed="${selected}"><span class="letter">${String.fromCharCode(65+i)}</span><img src="${assetPath('room1',name)}" alt="${label}" onerror="this.style.display='none'"><span class="opt-label">${label}</span></button>`}).join('');
 const fb=state.feedback?`<div class="feedback show ${state.feedbackType}">${state.feedback}</div>`:'';
 app.innerHTML=shell('room1',`<div class="screen">${heading('MISI 1 / 3',e.name,'Pilih tepat dua gambar peralatan yang diperlukan.') }<div class="modal-card grow"><div class="modal-head"><h2>Peralatan untuk ${e.name}</h2><p>Tandakan dua gambar yang betul. ${state.selected.size}/2 dipilih.</p></div><div class="option-grid">${options}</div>${fb}<div class="bottom-row"><button class="btn" onclick="checkEquipment()">SEMAK</button><button class="btn dark" onclick="backToRoom1()">KEMBALI</button></div></div></div>`,'STOR SUKAN',`${state.eventsDone.size}/5`);
}
function toggleEquipment(name){if(state.selected.has(name))state.selected.delete(name);else if(state.selected.size<2)state.selected.add(name);state.feedback='';render()}
function checkEquipment(){const e=events[state.activeEvent];const ok=state.selected.size===2&&e.correct.every(x=>state.selected.has(x));if(ok){sfx('correct');state.eventsDone.add(state.activeEvent);state.feedback='Betul! Acara berjaya diselesaikan.';state.feedbackType='good';render();setTimeout(()=>{if(state.scene==='event'){state.scene='room1';state.feedback='';render()}},650)}else{sfx('wrong');state.feedback='Belum tepat. Cuba pilih dua peralatan yang betul.';state.feedbackType='bad';render()}}
function backToRoom1(){state.scene='room1';state.feedback='';render()}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function goRoom2(){sfx('door');state.scene='room2';state.room2Order=shuffle([0,1,2,3,4]);state.room2Unlocked=false;state.feedback='';render();soundSceneCue('room2')}
function renderRoom2(app){const rows=state.room2Order.map((id,pos)=>{const item=warmups[id];return `<div class="order-item" draggable="true" data-id="${id}" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="dropItem(event)" ondragend="dragEnd(event)"><span class="order-num">${pos+1}</span><img src="${assetPath('room2/warmup',item.file)}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="warmup-fallback" style="display:none">${item.emoji}</span><span class="order-label">${item.name}</span><button class="order-move" aria-label="Naikkan ${item.name}" onclick="moveWarmup(${pos},-1)" ${pos===0?'disabled':''}>▲</button><button class="order-move" aria-label="Turunkan ${item.name}" onclick="moveWarmup(${pos},1)" ${pos===4?'disabled':''}>▼</button></div>`}).join('');
 const fb=state.feedback?`<div class="feedback show ${state.feedbackType}">${state.feedback}</div>`:'';
 const next=state.room2Unlocked?button('KELUAR KE PADANG →','goRoom3()','gold'):'';
 app.innerHTML=shell('room2',`<div class="screen">${heading('MISI 2 / 3','DEWAN SEKOLAH','Susun langkah pemanasan badan dari kepala hingga kaki.') }<div class="panel"><h2>ARAHAN</h2><p>Susun lima langkah mengikut urutan yang betul. Seret gambar atau gunakan butang ▲ ▼.</p></div><div class="order-list grow">${rows}</div>${fb}<div class="bottom-row">${state.room2Unlocked?button('KELUAR KE PADANG →','goRoom3()','gold'):button('SEMAK URUTAN','checkWarmups()')}</div></div>`,'DEWAN SEKOLAH',state.room2Unlocked?'SELESAI':'2/3');
}
let draggedWarmup=null;
function dragStart(e){draggedWarmup=Number(e.currentTarget.dataset.id);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(draggedWarmup));e.currentTarget.classList.add('dragging')}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('over')}
function dropItem(e){e.preventDefault();const target=Number(e.currentTarget.dataset.id);if(draggedWarmup===null||draggedWarmup===target)return;const from=state.room2Order.indexOf(draggedWarmup),to=state.room2Order.indexOf(target);state.room2Order.splice(from,1);state.room2Order.splice(to,0,draggedWarmup);draggedWarmup=null;render()}
function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.order-item').forEach(x=>x.classList.remove('over'));draggedWarmup=null}
function moveWarmup(pos,delta){const to=pos+delta;if(to<0||to>=state.room2Order.length)return;[state.room2Order[pos],state.room2Order[to]]=[state.room2Order[to],state.room2Order[pos]];state.feedback='';render()}
function checkWarmups(){const ok=state.room2Order.every((id,i)=>id===i);sfx(ok?'correct':'wrong');state.feedback=ok?'Betul! Pintu dewan berjaya dibuka.':'Cuba lagi. Susun dari Kepala → Bahu → Tangan → Pinggang → Kaki.';state.feedbackType=ok?'good':'bad';if(ok)state.room2Unlocked=true;render()}
function backToRoom1(){state.scene='room1';render()}
function goRoom3(){sfx('door');state.scene='room3';state.safetyIndex=0;state.feedback='';render();soundSceneCue('room3')}
function renderRoom3(app){const q=safety[state.safetyIndex];const opts=q.opts.map((t,i)=>`<button class="safety-option" onclick="answerSafety(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${t}</button>`).join('');
 const img=`<img class="scenario-img" src="${assetPath('room3/scenarios',q.file)}" alt="Situasi: ${q.title}" onerror="this.outerHTML='<div class=&quot;scenario-fallback&quot;>${q.emoji}</div>'">`;
 const fb=state.feedback?`<div class="feedback show ${state.feedbackType}">${state.feedback}</div>`:'';
 app.innerHTML=shell('room3',`<div class="screen">${heading('MISI 3 / 3','PADANG SEKOLAH','Jawab lima soalan keselamatan sukan.') }<div class="panel"><h2>SOALAN ${state.safetyIndex+1} / 5 — ${q.title}</h2><p>${q.q}</p></div>${img}<div class="safety-options grow">${opts}</div>${fb}</div>`,'PADANG',`${state.safetyIndex+1}/5`);
}
function answerSafety(i){const q=safety[state.safetyIndex];if(i===q.correct){sfx('correct');state.feedback='Betul! Bagus!';state.feedbackType='good';render();setTimeout(()=>{if(state.scene!=='room3')return;if(state.safetyIndex<4){state.safetyIndex++;state.feedback='';render()}else{state.scene='gate';state.feedback='';render()}},600)}else{sfx('wrong');state.feedback='Belum tepat. Cuba lagi!';state.feedbackType='bad';render();setTimeout(()=>{if(state.scene==='room3'){state.feedback='';render()}},800)}}
function renderGate(app){app.innerHTML=shell('gate',`<div class="screen">${heading('MISI SELESAI','PENGAWAL MEMBANTU!','Semua soalan keselamatan dijawab dengan betul.') }<div class="ending-center"><div class="panel" style="text-align:center;max-width:420px"><div style="font-size:clamp(58px,18vw,94px)">🛡️🔓</div><h2>Pintu pagar dibuka!</h2><p>Pengawal keselamatan datang membantu kamu keluar dari sekolah.</p></div></div>${button('KELUAR DARI SEKOLAH →','wakeUp()','gold')}</div>`,'PADANG','SELESAI')}
function wakeUp(){sfx('whoosh');state.scene='ending';render();soundSceneCue('ending')}
function renderEnding(app){app.innerHTML=shell('ending',`<div class="screen" style="align-items:center;text-align:center">${heading('TAMAT','RUPANYA HANYA MIMPI!','Kamu berjaya menyelesaikan semua misi.') }<div class="ending-center"><img class="ending-student" src="${assetPath('ui','ending-student.png')}" alt="Murid terjaga dengan terkejut" onerror="this.style.display='none'"></div><div class="panel"><h2>RING! RING! RING!</h2><p>Kamu terjaga di dalam kelas. Rupa-rupanya, semua kejadian tadi hanyalah mimpi!</p><p class="small">Ingat: Utamakan keselamatan semasa bersukan.</p></div><div class="bottom-row"><button class="btn gold" onclick="resetGame()">MAIN SEMULA</button></div></div>`,'TAMAT','100%');}
function resetGame(){sfx('tap');state.scene='intro';state.eventsDone=new Set();state.activeEvent=0;state.selected=new Set();state.room2Order=[];state.safetyIndex=0;state.storyOpen=false;state.feedback='';state.room2Unlocked=false;render()}
render();
</script>
</body></html>
